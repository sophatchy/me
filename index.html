<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sophat CHY - Social Media</title>
    
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel to make React work in the browser without build tools -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-white">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- Icons (Defined here so no external files are needed) ---
        const ExternalLink = ({ size = 24, className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        );

        const Share2 = ({ size = 24, className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
        );

        const Check = ({ size = 24, className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="20 6 9 17 4 12"/></svg>
        );

        // --- Main Component ---
        const SocialLink = ({ name, url, icon, color, description }) => (
            <a
                href={url}
                target="_blank"
                rel="noopener noreferrer"
                className="group relative flex items-center p-4 mb-4 bg-gray-800/50 hover:bg-gray-700/50 backdrop-blur-md border border-gray-700/50 rounded-xl transition-all duration-300 hover:scale-[1.02] hover:shadow-lg hover:border-gray-600 overflow-hidden"
            >
                {/* Hover Gradient Background */}
                <div 
                className="absolute inset-0 opacity-0 group-hover:opacity-10 transition-opacity duration-300"
                style={{ backgroundColor: color }}
                />
                
                {/* Icon Container */}
                <div 
                className="flex-shrink-0 w-12 h-12 flex items-center justify-center rounded-full bg-gray-900/50 border border-gray-700 text-white transition-transform duration-300 group-hover:rotate-6"
                style={{ color: color }}
                >
                {icon}
                </div>

                {/* Text Content */}
                <div className="ml-4 flex-grow z-10">
                <h3 className="font-bold text-gray-100 group-hover:text-white transition-colors">{name}</h3>
                <p className="text-xs text-gray-400 group-hover:text-gray-300">{description}</p>
                </div>

                {/* Arrow Icon */}
                <div className="mr-2 text-gray-500 group-hover:text-white opacity-0 group-hover:opacity-100 transition-all duration-300 transform translate-x-[-10px] group-hover:translate-x-0">
                <ExternalLink size={20} />
                </div>
            </a>
        );

        function App() {
            const [copied, setCopied] = useState(false);
            const [mounted, setMounted] = useState(false);

            useEffect(() => {
                setMounted(true);
            }, []);

            const handleShare = async () => {
                const url = window.location.href;
                
                if (navigator.share) {
                try {
                    await navigator.share({
                    title: 'Sophat CHY - Social Media',
                    text: 'Check out Sophat CHY on social media!',
                    url: url,
                    });
                    return;
                } catch (err) {
                    console.log('Error sharing:', err);
                }
                }

                try {
                const textArea = document.createElement("textarea");
                textArea.value = url;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                
                setCopied(true);
                setTimeout(() => setCopied(false), 2000);
                } catch (err) {
                console.error('Failed to copy', err);
                }
            };

            const socialLinks = [
                {
                name: 'YouTube',
                url: 'https://youtube.com/sophatchy',
                color: '#FF0000',
                description: 'Subscribe for latest videos',
                icon: (
                    <svg viewBox="0 0 24 24" fill="currentColor" className="w-6 h-6">
                    <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
                    </svg>
                )
                },
                {
                name: 'Facebook',
                url: 'https://fb.com/SophatCHY',
                color: '#1877F2',
                description: 'Follow my page',
                icon: (
                    <svg viewBox="0 0 24 24" fill="currentColor" className="w-6 h-6">
                    <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.791-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
                    </svg>
                )
                },
                {
                name: 'Instagram',
                url: 'https://www.instagram.com/sophatchy',
                color: '#E4405F',
                description: 'Photos & Stories',
                icon: (
                    <svg viewBox="0 0 24 24" fill="currentColor" className="w-6 h-6">
                    <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
                    </svg>
                )
                },
                {
                name: 'TikTok',
                url: 'https://www.tiktok.com/@sophatchy',
                color: '#00F2EA',
                description: 'Watch short videos',
                icon: (
                    <svg viewBox="0 0 24 24" fill="currentColor" className="w-6 h-6">
                    <path d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.49-3.35-3.98-5.6-.48-2.24.12-4.55 1.5-6.4.32-.42.69-.85 1.09-1.2.19-.18.4-.37.6-.52.03-.02.07-.02.1-.02 1.24-.04 2.52.03 3.76-.03-.13 1.17-.08 2.37.14 3.53.19 1.02.6 1.98 1.25 2.8.96 1.2 2.72 1.83 4.22 1.49 1.15-.26 2.11-1.11 2.56-2.18.42-1 .59-2.12.59-3.2v-8.4c-1.49-.04-2.98-.03-4.47-.03v-4.2z"/>
                    </svg>
                )
                },
                {
                name: 'Telegram',
                url: 'https://t.me/SophatCHY',
                color: '#229ED9',
                description: 'Chat with me',
                icon: (
                    <svg viewBox="0 0 24 24" fill="currentColor" className="w-6 h-6">
                    <path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/>
                    </svg>
                )
                }
            ];

            return (
                <div className="min-h-screen bg-slate-950 text-white font-sans selection:bg-purple-500/30">
                {/* Background Effects */}
                <div className="fixed inset-0 overflow-hidden pointer-events-none">
                    <div className="absolute top-[-10%] right-[-5%] w-96 h-96 bg-purple-600/20 rounded-full blur-3xl opacity-50" />
                    <div className="absolute bottom-[-10%] left-[-5%] w-96 h-96 bg-blue-600/20 rounded-full blur-3xl opacity-50" />
                    <div className="absolute top-[40%] left-[50%] transform -translate-x-1/2 w-[800px] h-[800px] bg-indigo-900/10 rounded-full blur-3xl" />
                </div>

                <div className={`relative max-w-2xl mx-auto px-4 py-12 flex flex-col items-center min-h-screen transition-opacity duration-1000 ${mounted ? 'opacity-100' : 'opacity-0'}`}>
                    
                    {/* Header Section */}
                    <div className="flex flex-col items-center mb-10 w-full transform transition-all duration-700 translate-y-0">
                    {/* Profile Image / Initials */}
                    <div className="relative group mb-6">
                        <div className="absolute -inset-0.5 bg-gradient-to-r from-purple-600 to-blue-500 rounded-full opacity-75 group-hover:opacity-100 transition duration-300 blur-sm"></div>
                        <div className="relative w-32 h-32 bg-slate-900 rounded-full flex items-center justify-center border-4 border-slate-950 shadow-2xl overflow-hidden">
                        {/* Using initials since no image was provided, but structured to easily swap for <img src="..." /> */}
                        <span className="text-4xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-purple-500">
                            SC
                        </span>
                        </div>
                        {/* Online Status Dot */}
                        <div className="absolute bottom-1 right-1 w-6 h-6 bg-green-500 rounded-full border-4 border-slate-950 z-10" title="Online" />
                    </div>

                    <h1 className="text-3xl font-bold mb-2 text-center bg-clip-text text-transparent bg-gradient-to-r from-white to-gray-400">
                        Sophat CHY
                    </h1>
                    
                    <div className="flex items-center gap-2 mb-6">
                        <span className="px-3 py-1 bg-blue-500/10 border border-blue-500/20 text-blue-400 text-xs rounded-full font-medium">
                        @sophatchy
                        </span>
                        <span className="px-3 py-1 bg-purple-500/10 border border-purple-500/20 text-purple-400 text-xs rounded-full font-medium">
                        Content Creator
                        </span>
                    </div>

                    <p className="text-gray-400 text-center max-w-md mb-8 leading-relaxed">
                        Welcome to my social hub! Connect with me on your favorite platforms below.
                    </p>

                    {/* Share Button */}
                    <button 
                        onClick={handleShare}
                        className="flex items-center gap-2 px-6 py-2 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-full transition-all text-sm font-medium mb-8 active:scale-95"
                    >
                        {copied ? <Check size={16} className="text-green-400" /> : <Share2 size={16} />}
                        {copied ? 'Link Copied!' : 'Share Profile'}
                    </button>
                    </div>

                    {/* Links Grid */}
                    <div className="w-full max-w-md space-y-4">
                    {socialLinks.map((link, index) => (
                        <SocialLink key={index} {...link} />
                    ))}
                    </div>

                    {/* Footer */}
                    <footer className="mt-16 text-center text-gray-600 text-sm">
                    <p>© {new Date().getFullYear()} Sophat CHY. All rights reserved.</p>
                    </footer>
                </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
